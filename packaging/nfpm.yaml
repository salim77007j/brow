# brow — canonical Linux packager config (Phase 5)
#
# One definition, two package formats: `nfpm package -p deb` and
# `nfpm package -p rpm`. This is the path the release CI uses;
# packaging/linux/build-deb.sh is the debhelper-free dpkg cross-check.
#
# Conventions:
#   * Always invoke from the REPOSITORY ROOT:
#       nfpm package -f packaging/nfpm.yaml -p deb \
#         -t dist/brow_${BROW_VERSION}_amd64.deb
#   * Required environment (release.yml exports this):
#       BROW_VERSION   e.g. 0.5.0 (no leading 'v')
#   * Payload comes from the canonical staging dir packaging/payload/
#     (created by release.yml; nfpm does NOT expand env vars in
#     contents[].src paths, so the payload path is relative, not templated).
#   * arch "amd64" is auto-translated to rpm's "x86_64" by nfpm.
#
# Installed layout (canonical; build-deb.sh mirrors it — keep in sync):
#   /usr/lib/brow/brow                        real binary; resources sit beside it
#   /usr/lib/brow/resources/                  engine resources incl. easylist.txt
#   /usr/bin/brow                             -> /usr/lib/brow/brow
#   /usr/share/applications/brow.desktop
#   /usr/share/icons/hicolor/{64x64,128x128,256x256}/apps/brow.png
#   /usr/share/metainfo/brow.metainfo.xml
#   /usr/share/licenses/brow/LICENSE
name: brow
arch: amd64
platform: linux
version: ${BROW_VERSION}
release: "1"
section: web
priority: optional
maintainer: brow engineering <salim77007j@users.noreply.github.com>
description: >
  Ultra-lightweight, privacy-first web browser built on the Servo rendering
  engine. Network-level ad blocking (EasyList/ABP), CNAME cloaking detection,
  anti-fingerprinting, CHIPS partitioned cookies, HTTP/3 + QUIC transport and
  DNS-over-HTTPS. 100% Rust core. No telemetry, ever.
homepage: https://github.com/salim77007j/brow
license: MPL-2.0

# RPM-specific field (deb's equivalent is `section: web` above).
rpm:
  group: Applications/Internet

contents:
  - src: packaging/payload/brow
    dst: /usr/lib/brow/brow
    file_info:
      mode: 0755
  - src: packaging/payload/resources
    dst: /usr/lib/brow/resources
  - src: packaging/linux/brow.desktop
    dst: /usr/share/applications/brow.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/brow.metainfo.xml
    dst: /usr/share/metainfo/brow.metainfo.xml
    file_info:
      mode: 0644
  - src: packaging/icons/brow_64.png
    dst: /usr/share/icons/hicolor/64x64/apps/brow.png
    file_info:
      mode: 0644
  - src: packaging/icons/brow_128.png
    dst: /usr/share/icons/hicolor/128x128/apps/brow.png
    file_info:
      mode: 0644
  - src: packaging/icons/brow_256.png
    dst: /usr/share/icons/hicolor/256x256/apps/brow.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/brow/LICENSE
    file_info:
      mode: 0644
  - type: symlink
    src: /usr/lib/brow/brow
    dst: /usr/bin/brow

# Runtime dependencies mirror servo's Linux requirements (X11/wayland,
# fontconfig, GStreamer, ALSA). libasound2 was renamed libasound2t64 on
# Ubuntu 24.04 — the alternative covers both generations.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libfontconfig1
      - libfreetype6
      - libx11-6
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libegl1
      - libgl1
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - libasound2t64 | libasound2
      - libdbus-1-3
      - libudev1
    recommends:
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
  rpm:
    depends:
      - glibc >= 2.35
      - fontconfig
      - freetype
      - libX11
      - libxkbcommon
      - libxkbcommon-x11
      - wayland
      - mesa-libEGL
      - mesa-libGL
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - alsa-lib
      - dbus-libs
      - systemd-libs
    recommends:
      - gstreamer1-plugins-bad-free
