[package]
name = "brow-shell"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "brow: single-window product shell — a thin bin over the servoshell desktop shell (D-010) with brow identity, settings.json profile plumbing and the privacy status counter"
repository = "https://github.com/salim77007j/brow"

# brow v0.7 (D-010): the two-window Slint/softbuffer chrome stack is deleted.
# This crate is now the product identity + profile layer over the proven
# servoshell single-window shell (libified in-tree):
#   * settings.json (brow-shell-core) -> engine Preferences + shell overrides
#   * brow identity (title, app id, icon) via servoshell::shell::set_identity
#   * privacy blocked counter via brow-privacy global atomics (D-011)
# The CI contract is unchanged: binary name `brow-shell`, BROW_DATA_DIR +
# settings.json schema, engine log markers, size gate.

[dependencies]
brow-shell-core = { workspace = true }
brow-privacy = { workspace = true }
servoshell = { path = "../servoshell" }
# Direct engine facade dep for the `Preferences`/`PrefValue` types and to pin
# the features the product needs beyond servoshell's default set (feature
# unification merges them into one servo build).
servo = { workspace = true, default-features = false, features = [
    "background_hang_monitor",
    "bluetooth",
    "testbinding",
    "bundled",
    "js_jit",
    "clipboard",
    "brotli-compression-stream",
    "webcrypto",
    "webgl",
    "webgpu",
    "webxr",
] }
log = { workspace = true }
env_logger = { workspace = true }
