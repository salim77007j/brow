[package]
name = "brow-shell-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "brow: browser-chrome brain — tab lifecycle (sleep/discard/restore), bookmarks, history, downloads, settings, i18n (en/ar RTL), memory budget tracking"
repository = "https://github.com/salim77007j/brow"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
