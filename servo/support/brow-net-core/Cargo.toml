[package]
name = "brow-net-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "brow: modern network protocol core — HTTP/3/QUIC transport, DoH resolver, Alt-Svc cache, COOP/COEP/CORP policy engine, TLS policy"
repository = "https://github.com/salim77007j/brow"

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "http2", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = "0.5"
log = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
webpki-roots = "0.26"

[dev-dependencies]
hyper = { version = "1", features = ["server"] }
rcgen = "0.14"
