[package]
name = "brow-resbench"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "brow: process-level resource benchmark harness — RSS/CPU sampling, per-tab accounting, cross-browser comparison"
repository = "https://github.com/salim77007j/brow"

[lib]
name = "brow_resbench"
path = "src/lib.rs"

[[bin]]
name = "brow-resbench"
path = "src/main.rs"

[[bin]]
name = "resbench-fixture"
path = "src/fixture.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

