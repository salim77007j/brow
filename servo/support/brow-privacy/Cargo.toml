[package]
name = "brow-privacy"
version = "0.1.0"
authors = ["The brow Project Developers"]
edition = "2021"
rust-version = "1.80.0"
license = "MPL-2.0"
publish = false
description = "brow privacy engine: network filtering (EasyList/ABP syntax over Aho-Corasick), cosmetic filtering, CNAME-cloaking detection, anti-fingerprinting defenses and CHIPS partitioned-cookie enforcement"

[lib]
name = "brow_privacy"
path = "src/lib.rs"
test = true
doctest = false

[dependencies]
aho-corasick = "1.1"
memchr = "2.8"
regex = { workspace = true }
url = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }

[features]
brow-debug-decisions = []

[dev-dependencies]
criterion = { workspace = true }
# brow (7.2): the score rubric asserts the compiled-in engine defaults
# (DoH on, https templates) through the live pref store.
servo-config = { workspace = true }

[[bench]]
name = "match_bench"
harness = false
