[package]
name = "brow-phase6"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "brow: Phase 6 comparative validation harness — 10-category site benchmark, load stress test, HTML parse pipeline and RSS sampling (the measurement side of FINAL_COMPARISON_REPORT.md)"
repository = "https://github.com/salim77007j/brow"
publish = false

[dependencies]
brow-net-core = { path = "../brow-net-core" }
bytes = "1"
http = "1"
http-body-util = "0.1"
html5ever = { workspace = true }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "webpki-tokio", "http1", "http2", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "time", "sync"] }
webpki-roots = "0.26"

[[bin]]
name = "brow-phase6"
path = "main.rs"

[[bin]]
name = "diag_connect"
path = "src/bin/diag_connect.rs"
