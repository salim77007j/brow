[package]
name = "brow-cache"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "brow: mmap-backed content-addressed HTTP cache + cross-tab resource dedup pool"
repository = "https://github.com/salim77007j/brow"

[dependencies]
log = "0.4"
memmap2 = "0.9.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
