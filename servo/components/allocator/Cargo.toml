[package]
name = "servo-allocator"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
path = "lib.rs"

[features]
allocation-tracking = ["backtrace", "dep:rustc-hash"]
use-jemalloc = ["dep:tikv-jemalloc-sys", "dep:tikv-jemallocator"]
# brow: mimalloc global allocator — smaller RSS for many-small-object browser
# workloads. Mutually exclusive with use-jemalloc (compile_error if both).
use-mimalloc = ["dep:libmimalloc-sys"]

[dependencies]
backtrace = { workspace = true, optional = true }
log = { workspace = true }
rustc-hash = { workspace = true, optional = true }

[lints]
workspace = true

[target.'cfg(not(any(windows, target_env = "ohos")))'.dependencies]
libc = { workspace = true }
tikv-jemalloc-sys = { workspace = true, optional = true, features = ["stats"] }
tikv-jemallocator = { workspace = true, optional = true }
libmimalloc-sys = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }

[target.'cfg(target_env = "ohos")'.dependencies]
libc = { workspace = true }
