# Experiment: O2/O3 SIGSEGV codegen bisect (v0.7 Phase 1, see docs/V2_PLAN.md)
#
# Purpose. brow v0.6.1-era experiments showed that switching the shipped
# [profile.production] from opt-level="s" to opt-level 2 or 3 (keeping
# lto=true (fat) + codegen-units=1) produces a reproducible SIGSEGV in the
# Script thread on https://www.wikipedia.org (see the comment block above
# [profile.production] in servo/Cargo.toml). The default `release` profile
# (opt-level 3, no LTO, 16 CGUs) builds green in CI and — as of the first
# gated run — its smoke test passes, which makes **fat LTO x high opt-level**
# the prime suspect.
#
# Method. Build the product shell (brow-shell, which embeds the full engine)
# under the `production` profile while overriding single codegen knobs via
# Cargo's profile environment overrides (CARGO_PROFILE_*), then load the
# wikipedia repro page under Xvfb + software GL and classify the outcome from
# timeout(1)'s exit status (round-2 harness; round-1 aborted inside `wait`
# under bash -e before any verdict printed — see docs/EXPERIMENTS.md E-001):
#   PASS(alive 150s) = rc 124: observation window elapsed, process ALIVE
#   CRASH(signal N)  = rc >= 128: process died of a signal (the hunted event)
#   EXITED(rc)       = anything else: clean early exit (also a red job — a
#                      GUI shell must not exit on its own mid-window)
# Every path also prints the engine load markers ("filter engine loaded" +
# "fingerprint defenses active" — the same signals the product smoke gate
# uses) so an "alive" verdict is never mistaken for a page that never loaded,
# and uploads crash-test.log even on red jobs.
#
# Variants.
#   s-control      shipped config (opt "s", fat LTO, 1 CGU)  -> EXPECT PASS
#   o3-fat-repro   opt 3, fat LTO (the crashing config)      -> EXPECT CRASH
#                  — validates that the crash reproduces in CI at all
#   o3-nolto       opt 3, no LTO, 16 CGUs                    -> if PASS: fat LTO implicated
#   o3-thin        opt 3, thin LTO, 1 CGU                    -> upstream-like middle point
#   o3-fat-mozjsO1 opt 3, fat LTO, mozjs/mozjs-sys at opt 1  -> if PASS: mozjs codegen implicated
#
# Rules (docs/PROCESS.md §0.5): this workflow lives ONLY on the
# experiment/o2o3-codegen branch; it never runs against main; every result is
# recorded in docs/EXPERIMENTS.md on the experiment branch before any fix
# lands on v0.7-rebuild.

name: experiment-codegen-matrix

on:
  workflow_dispatch:
    inputs:
      variant_set:
        description: "Which matrix variants to run: 'all' (full matrix) or 'anchors' (s-control + o3-fat-repro only — used when the other variants already hold verdicts, E-001 round 3)"
        type: choice
        options:
          - all
          - anchors
        default: all

env:
  CARGO_TERM_COLOR: always

jobs:
  codegen:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # variant_set=anchors runs only the two D-007 anchor variants; 'all' runs
    # the full matrix (the push trigger was removed: round 3 is explicitly
    # dispatched — a workflow-file push must not silently re-burn 5 builds).
    if: ${{ inputs.variant_set != 'anchors' || matrix.anchor }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: s-control
            opt_level: ""
            lto: ""
            cgu: ""
            mozjs_o1: false
            anchor: true
          - id: o3-fat-repro
            opt_level: "3"
            lto: ""
            cgu: ""
            mozjs_o1: false
            anchor: true
          - id: o3-nolto
            opt_level: "3"
            lto: "off"
            cgu: "16"
            mozjs_o1: false
            anchor: false
          - id: o3-thin
            opt_level: "3"
            lto: "thin"
            cgu: "1"
            mozjs_o1: false
            anchor: false
          - id: o3-fat-mozjsO1
            opt_level: "3"
            lto: ""
            cgu: ""
            mozjs_o1: true
            anchor: false
    steps:
      - name: Checkout brow (with vendored servo/)
        uses: actions/checkout@v4

      - name: Free disk space for the ~20 GB build tree
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --force || true
          df -h /

      - name: Install uv (required by mach)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Servo build dependencies (3-attempt retry — round-2 GHA flake)
        # Round 2 lost both anchor jobs to a runner flake that hung
        # 'mach bootstrap' for 5.5 h until the 330-min job timeout killed it.
        # Guard each attempt at 15 min and retry twice; a hung bootstrap now
        # fails fast instead of burning the whole job budget.
        run: |
          sudo apt-get update
          cd servo
          ok=0
          for attempt in 1 2 3; do
            echo "--- mach bootstrap attempt ${attempt}/3 (15-min guard) ---"
            RC=0
            timeout 900 ./mach bootstrap || RC=$?
            if [ "$RC" -eq 0 ]; then ok=1; break; fi
            echo "attempt ${attempt} failed rc=${RC} — sleeping 15s before retry"
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "mach bootstrap failed 3 consecutive attempts" >&2
            exit 1
          fi
          echo "mach bootstrap OK"

      - name: Apply codegen overrides for this variant
        run: |
          if [ -n "${{ matrix.opt_level }}" ]; then
            echo "CARGO_PROFILE_PRODUCTION_OPT_LEVEL=${{ matrix.opt_level }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ matrix.lto }}" ]; then
            echo "CARGO_PROFILE_PRODUCTION_LTO=${{ matrix.lto }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ matrix.cgu }}" ]; then
            echo "CARGO_PROFILE_PRODUCTION_CODEGEN_UNITS=${{ matrix.cgu }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.mozjs_o1 }}" = "true" ]; then
            echo "CARGO_PROFILE_PRODUCTION_PACKAGE_MOZJS_OPT_LEVEL=1" >> "$GITHUB_ENV"
            echo "CARGO_PROFILE_PRODUCTION_PACKAGE_MOZJS_SYS_OPT_LEVEL=1" >> "$GITHUB_ENV"
          fi
          echo "variant=${{ matrix.id }} opt=${{ matrix.opt_level }} lto=${{ matrix.lto || 'fat(inherited)' }} cgu=${{ matrix.cgu || '1(inherited)' }} mozjsO1=${{ matrix.mozjs_o1 }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build brow-shell under production profile
        run: |
          set -o pipefail
          cd servo
          cargo build --locked --profile production -p brow-shell 2>&1 | tail -5

      - name: Crash repro test — wikipedia under Xvfb + software GL
        # Round-2 harness (E-001 postmortem in docs/EXPERIMENTS.md):
        #   * verdict comes from timeout(1)'s exit status — no background PID,
        #     no wait-loop, so bash -e can never abort before the verdict;
        #   * 124  = window elapsed, process ALIVE  -> PASS (green job);
        #   * >=128 = process died of a signal      -> CRASH (red job). 137
        #     (SIGKILL) is kept visible as a crash: the log tail distinguishes
        #     an OOM kill from anything else;
        #   * other = clean early exit              -> EXITED (red job).
        run: |
          cd servo
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-brow"; mkdir -p "$XDG_RUNTIME_DIR"
          if [ -f /usr/share/glvnd/egl_vendor.d/50_mesa.json ]; then
            export __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
          fi
          export BROW_DATA_DIR="$RUNNER_TEMP/brow-data"; mkdir -p "$BROW_DATA_DIR"
          printf '{"home_page": "https://www.wikipedia.org/wiki/Servo_(software)", "block_ads": true}\n' \
            > "$BROW_DATA_DIR/settings.json"

          set +e
          RUST_LOG=info timeout 150 xvfb-run -a -s "-screen 0 1280x800x24" \
            target/production/brow-shell > "$RUNNER_TEMP/crash-test.log" 2>&1
          RC=$?
          set -e

          if [ "$RC" -eq 124 ]; then
            RESULT="PASS(alive 150s)"
          elif [ "$RC" -ge 128 ]; then
            RESULT="CRASH(signal $((RC - 128)))"
          else
            RESULT="EXITED(rc=$RC)"
          fi
          echo "VERDICT(${{ matrix.id }}): $RESULT" | tee -a "$GITHUB_STEP_SUMMARY"

          LOG="$RUNNER_TEMP/crash-test.log"
          LOADED=$(grep -acE "filter engine loaded" "$LOG" 2>/dev/null || true)
          PARSED=$(grep -acE "fingerprint defenses active" "$LOG" 2>/dev/null || true)
          echo "load markers: filter-engine=${LOADED:-0} fingerprint-defense=${PARSED:-0}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- crash signatures (first 8 matches) ---" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -aE "panic|SIGSEGV|segmentation|Script thread" "$LOG" 2>/dev/null \
            | head -8 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "--- crash-test.log tail (last 12 lines) ---" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -12 "$LOG" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          # Reap orphans if the window kill left the tree partially alive.
          pkill -f 'target/production/brow-shell' 2>/dev/null || true
          pkill -f 'Xvfb' 2>/dev/null || true

          cp "$LOG" "$GITHUB_WORKSPACE/crash-test-${{ matrix.id }}.log" 2>/dev/null || true

          # Verdict drives the job color: alive = green, anything else = red.
          case "$RESULT" in
            PASS*) exit 0 ;;
            *)     exit 1 ;;
          esac

      - name: Upload crash-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-test-${{ matrix.id }}
          path: crash-test-${{ matrix.id }}.log
          if-no-files-found: ignore
